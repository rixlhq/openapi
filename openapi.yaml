            schema:
              type: object
              properties:
                time_start:
                  type: string
                  examples:
                    - "2026-01-15T10:30:00Z"
                  title: time_start
                time_end:
                  type: string
                  examples:
                    - "2026-01-15T10:30:00Z"
                  title: time_end
                format:
                  examples:
                    - EXPORT_FORMAT_CSV
                  title: format
                  $ref: '#/components/schemas/analytics.v1.ExportFormat'
              title: ExportDashboardRequest
              required:
                - time_start
                - time_end
              additionalProperties: false
        required: true
      responses:
        default:
          $ref: '#/components/responses/Error'
        "200":
          description: Success
          content:
            application/json:
              schema:

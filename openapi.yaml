      operationId: analytics.v1.DashboardService.UpdateDashboard
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            title: id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  title: name
                visibility:
                  type: string
                  title: visibility
                  enum:
                    - ""
                    - private
                    - org
                expected_revision:
                  type: integer
                  title: expected_revision
                  format: int32
              title: UpdateDashboardRequest
              required:
                - name
                - expected_revision
              additionalProperties: false
        required: true
      responses:
        default:
          $ref: '#/components/responses/Error'

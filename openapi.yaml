openapi: 3.1.0
info:
  title: Rixl Cloud API
  version: "1"
  description: |-
    Customer-facing REST API for the Rixl platform. Provides video and image upload, processing, delivery, and analytics with edge validation of API keys (X-API-Key) and bearer tokens (Authorization).
    The contract for this API lives in the docs: [versioning and deprecation](https://docs.rixl.com/en/home/developer/versioning), [errors, retries and idempotency](https://docs.rixl.com/en/home/developer/error-handling) and [pagination](https://docs.rixl.com/en/home/developer/pagination).
paths:
  /analytics/v1/dashboard:
    get:
      tags:
        - Dashboards
      summary: GetDashboardStats
      operationId: analytics.v1.DashboardService.GetDashboardStats
      parameters:
        - name: time_start
          in: query
          required: true
          schema:
            type: string
            examples:
              - "2026-01-15T10:30:00Z"
            title: time_start
        - name: time_end
          in: query
          required: true
          schema:
            type: string
            examples:
              - "2026-01-15T10:30:00Z"
            title: time_end
        - name: interval
          in: query
          schema:
            type: string
            examples:
              - day
            title: interval
        - name: filter.countries
          in: query
          schema:
            type: array
            examples:
              - - US
                - CA
            items:
              type: string
              examples:
                - - US
                  - CA
            title: countries
        - name: filter.cities
          in: query
          schema:
            type: array
            examples:
              - - New York
                - London
            items:
              type: string
              examples:
                - - New York
                  - London
            title: cities
        - name: filter.devices
          in: query
          schema:
            type: array
            examples:
              - - mobile
                - desktop
            items:
              type: string
              examples:
                - - mobile
                  - desktop
            title: devices
        - name: filter.os
          in: query
          schema:
            type: array
            examples:
              - - iOS
                - Android
            items:
              type: string
              examples:
                - - iOS
                  - Android
            title: os
        - name: filter.languages
          in: query
          schema:
            type: array
            examples:
              - - en-US
                - fr-FR
            items:
              type: string
              examples:
                - - en-US
                  - fr-FR
            title: languages
        - name: filter.regions
          in: query
          schema:
            type: array
            examples:
              - - California
                - Ontario
            items:
              type: string
              examples:
                - - California
                  - Ontario
            title: regions
        - name: filter.browsers
          in: query
          schema:
            type: array
            examples:
              - - Chrome
                - Safari
            items:
              type: string
              examples:
                - - Chrome
                  - Safari
            title: browsers
        - name: filter.os_versions
          in: query
          schema:
            type: array
            examples:
              - - "17.4"
                - "14"
            items:
              type: string
              examples:
                - - "17.4"
                  - "14"
            title: os_versions
      responses:
        default:
          $ref: '#/components/responses/Error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/analytics.v1.DashboardStatsResponse'
  /analytics/v1/dashboard/chart-query:
    post:
      tags:

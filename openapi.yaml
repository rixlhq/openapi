    common.v1.File:
      type: object
      properties:
        id:
          type: string
          examples:
            - FpvLwyDMqu
          title: id
        project_id:
          type: string
          examples:
            - Bq4y3QB38S
          title: project_id
        format:
          type: string
          examples:
            - avif
          title: format
          description: |-
            format describes the artifact currently served at url, not the uploaded source,
             and is only meaningful once status is FILE_STATUS_READY. Video flips from "mp4"
             to "hls" when packaging completes; that is the only signal for choosing a
             progressive player over an HLS one. Known values: jpg, png, webp, avif, gif,
             mp4, hls, srt, vtt.
        url:
          type: string
          examples:
            - https://images.rixl.com/Bq4y3QB38S/FpvLwyDMqu
          title: url
        name:
          type: string
          examples:
            - original.jpeg
          title: name
          maxLength: 64
        size:
          type: string
          examples:
            - "1048576"
          title: size
          format: int64
          description: |-
            size is the uploaded source's byte size for usage accounting; it is not updated
             when packaging replaces the artifact, so it does not describe the object at url.
        status:
          examples:
            - FILE_STATUS_READY
          title: status
          $ref: '#/components/schemas/common.v1.FileStatus'
        created_at:
          examples:
            - "2026-01-15T10:30:00Z"
          title: created_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        updated_at:
          examples:
            - "2026-01-15T10:30:00Z"
          title: updated_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'

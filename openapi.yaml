          in: query
          description: Maximum number of items to return.
          schema:
            type: integer
            examples:
              - "25"
            title: limit
            maximum: 100
            minimum: 1
            format: int32
            default: 25
        - name: pagination.offset
          in: query
          description: Number of items to skip before collecting the result set.
          schema:
            type: integer
            examples:
              - "0"
            title: offset
            format: int32
            default: 0
      responses:
        default:
          $ref: '#/components/responses/Error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/webhooks.v1.ListEndpointAttemptsResponse'
  /webhooks/v1/projects/{project_id}/endpoints/{endpoint_id}/events/{event_id}/replay:
    post:
      tags:
        - Webhooks
      summary: ReplayEvent
      description: |-
        ReplayEvent re-delivers one event to one endpoint with the same
         webhook-id so consumers dedupe it against the original delivery.
      operationId: webhooks.v1.WebhookService.ReplayEvent
      parameters:
        - name: project_id
          in: path

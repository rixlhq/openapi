      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_revision:
                  type: integer
                  title: expected_revision
                  format: int32
                patch:
                  title: patch
                  $ref: '#/components/schemas/analytics.v1.WidgetPatch'
              title: UpdateWidgetRequest
              required:
                - expected_revision
                - patch
              additionalProperties: false
        required: true
      responses:
        default:
          $ref: '#/components/responses/Error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/analytics.v1.Widget'

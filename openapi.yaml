      title: WebhookEvent
      additionalProperties: false
      description: |-
        WebhookEvent is a recorded outbound notification. `data` is the exact
         object embedded in the delivered payload envelope.
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable message. Not stable; branch on the HTTP status.
        reason:
          type: string
          description: Machine-readable reason for some 4xx errors, such as `ORG_DELETED`, `MEMBERSHIP_SUSPENDED`, `NOT_A_MEMBER` or `STEP_UP_REQUIRED`. Absent when there is none, and always absent on 5xx.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Reason-specific details, such as `invitation_id` on `INVITATION_PENDING` or `max_age_seconds` on `STEP_UP_REQUIRED`. Absent when there is none.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Optional key (1-255 visible ASCII characters) that makes the request safe to retry. The first successful response is stored for 24 hours and a retry with the same key and payload is replayed verbatim — same IDs, URLs and expiry — with the response header `Idempotent-Replayed: true`. Reusing the key with a different payload fails with `400`; while the first request is still in flight a retry fails with `409` and a `Retry-After` header. A request that fails stores nothing, so the key can be reused. Replayed responses still count as billed API requests.'
      schema:
        type: string
        minLength: 1
        maxLength: 255
  responses:
    Error:
      description: 'Error. The body is `{"error": "<message>"}`, with `reason` on some 4xx errors. The HTTP status and `reason` carry the meaning.'
      headers:
        Retry-After:
          description: Seconds to wait before retrying. Sent on 503 and 504, and on 409 or 429 when the backend says when a retry can succeed. Absent means do not retry 409 or 429.
          schema:
            type: integer
        X-Request-Id:
          description: The caller's X-Request-Id, or one generated by the gateway. Quote it to support.
          schema:
            type: string
      content:

  /webhooks/v1/projects/{project_id}/endpoints/{endpoint_id}/attempts:
    get:
      tags:
        - Webhooks
      summary: ListEndpointAttempts
      description: |-
        ListEndpointAttempts returns the delivery history for one endpoint,
         newest first.
      operationId: webhooks.v1.WebhookService.ListEndpointAttempts
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            title: project_id
            minLength: 1
        - name: endpoint_id
          in: path
          required: true
          schema:
            type: string
            title: endpoint_id
            minLength: 1

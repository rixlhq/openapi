name: SDK Trigger

on:
  push:
    branches:
      - main
    paths:
      - openapi.yaml

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # Applies per matrix job; each is a single curl to the dispatches
    # endpoint, observed 0.28 min max across 36 runs.
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        repo:
          - rixl-js
          - rixl-go
          - rixl-java
          - rixl-csharp
          - rixl-php
          - rixl-python
          - rixl-ruby
          - rixl-rust
          - docs
    steps:
      - name: Dispatch regenerate
        uses: rixlhq/openapi/.github/actions/dispatch-repository-event@main
        with:
          token: ${{ secrets.BUILD_GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          repo: ${{ matrix.repo }}
          event_type: ${{ matrix.repo == 'docs' && 'regenerate-docs' || 'regenerate-sdk' }}
